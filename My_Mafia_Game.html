<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Mafia Game</title>
<style>
:root{--bg:#0b1020;--card:#151c34;--line:#26305a;--tx:#e8ecff;--mut:#8f9ac4;--ac:#e0457b;--ok:#4fd1a5;--bl:#4c8dff;--warn:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3fb;--card:#fff;--line:#d5daf0;--tx:#161b33;--mut:#5b648c}}
:root[data-theme="light"]{--bg:#f1f3fb;--card:#fff;--line:#d5daf0;--tx:#161b33;--mut:#5b648c}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c34;--line:#26305a;--tx:#e8ecff;--mut:#8f9ac4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:15px;margin:0}
p{color:var(--mut);margin:4px 0 14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.tiny{flex:none!important;padding:5px 10px!important;font-size:13px!important;border-radius:9px!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:5px 6px;font:inherit;font-size:13px;max-width:150px}
.top .set{display:flex;gap:6px;align-items:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{padding:16px 0;font-size:22px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.num.sel{border-color:var(--ac);background:var(--ac);color:#fff}
.small{grid-template-columns:repeat(5,1fr)}.small .num{padding:10px 0;font-size:15px}
.name{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-bottom:8px}
.name span{color:var(--mut);min-width:20px}.name span.lb{min-width:52px}.name input{flex:1;background:none;border:0;padding:10px 0;min-width:0}
.name.dup{border-color:var(--warn)}
.role{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;opacity:.6}
.role.on{opacity:1;border-color:var(--bl)}
.role .dot{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:18px}
.role .t{flex:1;min-width:0}.role b{display:block}.role small{color:var(--mut);display:block;line-height:1.3}
.lock{color:var(--warn);font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar div{max-width:520px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;padding:14px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:bold}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--tx);flex:0 0 auto;padding:14px 16px}
.btn:disabled{opacity:.4}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.reveal{text-align:center;padding:40px 8px}
.rc{margin:20px auto;padding:30px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rc .big{font-size:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:9}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%}
.modal input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin:8px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:none}
.err{color:var(--warn);min-height:20px;margin:0}
.pl{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
.pl.dead{opacity:.45;text-decoration:line-through}
.pl button{border:1px solid var(--line);border-radius:8px;background:none;padding:6px 10px}
.chk{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{margin-right:10px}
.tile{padding:20px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}.tile.done{border-color:var(--ok)}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}.opt.sel{border-color:var(--ac);background:var(--ac);color:#fff}
.paper{background:#efe6cf;color:#2b2418;border-radius:12px;padding:16px;margin-bottom:12px}.paper h2{margin:0 0 4px}.paper p{color:#2b2418;margin:0}
.night{background:#05070f;color:#e8ecff;border-radius:16px;padding:8px 12px 1px;margin-bottom:12px}
.rbox{height:auto;overflow:visible;font-size:17px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.rbox h2{margin:10px 0 2px;font-size:15px}.rbox p{margin:0 0 8px;color:var(--tx)}
@media (prefers-reduced-motion:no-preference){.rc{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}}}
</style>
</head>

Promise.resolve(RM.join("mafia"+c)).then(function(r){AROOM=r;r.presence({adm:1,dv:DEV});r.onPeers(function(){if(S.step==30)render()});S.aerr="";render()}).catch(function(){S.aerr="Could not join.";render()})},
hostPlay:function(){var v=(S.hname||"").trim();if(!v||!S.on)return;S.on.hostName=v;S.on.lastPub=null;hostPub();setTimeout(function(){S.on.players=roster();render()},400)},
hostRoles:function(){var o=S.on;S.n=o.players.length;S.names=o.players.map(function(q){return q.name});S.pick=auto(S.n);S.step=2},
toLobby:function(){S.step=11},
leave:function(){unwatch();S.on=null;S.step=20},
tts:function(){S.tts=!S.tts;saveSet();if(!S.tts)try{speechSynthesis.cancel()}catch(e){}},
say:function(){lastSp=""},
showMine:function(){S.on.show=true;S.read=false},hideMine:function(){S.on.show=false;S.read=false;if(S.on.key){try{localStorage.setItem('mafia_seen_'+S.on.key,'1')}catch(e){}S.step=17}},

toPlayers:function(){S.step=0},
toNames:function(){syncNames();S.step=1},
setCustom:function(){var v=parseInt(document.getElementById("ccount").value,10);if(!v||v<1||v>200){alert("Enter a number from 1 to 200.");return}S.n=v;S.pick={}},
autoNames:function(){var pool=["Alex","Sam","Jordan","Riley","Morgan","Casey","Taylor","Jamie","Avery","Quinn","Drew","Blake","Cameron","Dana","Elliot","Finn","Gray","Harper","Indy","Jules","Kai","Lee","Max","Noel","Parker","Reese","Sage","Toby","Val","Wren","Zane","Ash","Bailey","Charlie","Devon","Emery","Frankie","Glen","Hayden","Jesse","Kit","Logan","Mika","Nico","Oakley","Pat","Robin","Skye","Tate","Uri"];
var used={};S.names.forEach(function(x){var k=(x||"").trim().toLowerCase();if(k)used[k]=1});
var free=shuffle(pool.filter(function(x){return!used[x.toLowerCase()]}));
for(var i=0;i<S.n;i++){var cur=(S.names[i]||"").trim();if(cur)continue;var nm=free.pop();if(!nm){var c=i+1;while(used["player "+c])c++;nm="Player "+c}used[nm.toLowerCase()]=1;S.names[i]=nm}S.filled=true},
clearNames:function(){S.names=[];syncNames();S.filled=false},
toRoles:function(){if(total()!=S.n)S.pick=auto(S.n);S.step=2},
loadGroup:function(){S.n=S.saved.length;S.names=S.saved.slice();S.step=1},
fill:function(){S.pick=auto(S.n)},
save:function(){try{localStorage.setItem("mafia_group",JSON.stringify(S.names));S.saved=S.names.slice()}catch(e){}},
manOn:function(){S.manual=true},manOff:function(){S.manual=false},
confirmMan:function(){S.codes=null;S.ri=0;S.shown=false;S.dead={};newGame();S.step=3},
start:function(){if(S.on){dealOnline();return}S.codes=null;if(S.manual){S.assign=S.names.map(function(n){return{name:n.trim(),role:""}});S.step=16;return}S.seed=Math.floor(Math.random()*2147483647);S.assign=dealSeed(S.names.map(function(x){return x.trim()}),S.pick,S.seed);S.ri=0;S.shown=false;S.dead={};newGame();S.step=3},
show:function(){S.shown=true},
hide:function(){S.shown=false;S.ri++},
restart:function(){unwatch();S.on=null;S.step=20;S.assign=[]},
unpremium:function(){S.prem=false;savePrem(false);S.modal=false;S.pick=auto(S.n)},
closeM:function(){S.modal=false;S.err=""},
unlock:function(){var v=document.getElementById("code").value.trim();
if(v===CODE){S.prem=true;S.modal=false;S.err="";savePrem(true);}else S.err="That code is not valid. Check it and try again."}
};
$.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.n){S.n=+d.n;S.pick={};S.seq=(S.seq||[]).concat(+d.n).slice(-6);if(S.seq.join(",")=="6,7,6,7,6,7"){S.custom=true;S.god=true;try{localStorage.setItem("mafia_god","1");navigator.vibrate&&navigator.vibrate(60)}catch(e){}}}
else if(d.a&&act[d.a]){act[d.a]()}
else if(d.r){var r=R[d.r];
if(r.pre&&!S.prem){S.modal=true}
else if(S.pick[r.id]){if(!r.req||mafCount()>S.pick.mafia)delete S.pick[r.id];else alert("You need at least one Mafia.")}
else if(r.min&&S.n<r.min){alert("The "+r.n+" needs at least "+r.min+" players to be fair.")}
else if(isMaf(r.id)&&mafCount()>=mafMax(S.n)){alert("With "+S.n+" players the Mafia team can have at most "+mafMax(S.n)+". Turn another Mafia role off first.")}
else if(total()>=S.n){alert("All "+S.n+" roles are filled. Turn another role off first.")}
else S.pick[r.id]=1}
else if(d.m){var k=d.m,nv=S.pick[k]+ +d.d;if(nv<1)nv=1;if(nv>S.pick[k]){if(total()>=S.n)return;if(isMaf(k)&&mafCount()>=mafMax(S.n)){alert("With "+S.n+" players the Mafia team can have at most "+mafMax(S.n)+".");return}}S.pick[k]=nv}
else if(d.rv!==undefined){G.alive[+d.rv]=true}
else if(d.kick!==undefined){act.kick(d.kick)}
else if(d.bn!==undefined){pubBan(d.bn,d.nm,false)}
else if(d.ub!==undefined){pubBan(d.ub,"",true)}
else if(d.np!==undefined){pickNp(d.np)}
else if(d.dx!==undefined){var pr=d.dx.split("|");sendDx(pr[0],pr.slice(1).join("|"))}
else if(d.sh!==undefined){shareRole(+d.sh);return}
else if(d.x){S.dead[d.x]=!S.dead[d.x]}
else if(d.t!==undefined){S.cur=+d.t;S.read=false}
else if(d.dp!==undefined){var di=+d.dp,dk=PW[S.assign[di].role];if(dk=="cancel"){G.used[di]=true;G.vcancel=true;G.dp={i:di,ans:"Vote cancelled: nobody can be voted out today."}}else if(dk=="dprot")G.dp={i:di,mode:"dprot"};else G.dp={i:di,mode:"ask"}}
else if(d.dpt!==undefined){var dt=+d.dpt,dd=G.dp;if(dd.mode=="dprot"){G.used[dd.i]=true;G.vprot=[dt];G.dp={i:dd.i,ans:S.assign[dt].name+" cannot be voted out today."}}else{G.used[dd.i]=true;G.dp={i:dd.i,ans:S.assign[dt].name+(isMaf(S.assign[dt].role)?" IS Mafia.":" is NOT Mafia.")}}}
else if(d.dq!==undefined){var dd2=G.dp;if(d.dq=="cnt"){var mc=0;S.assign.forEach(function(q,i){if(G.alive[i]&&isMaf(q.role))mc++});G.used[dd2.i]=true;G.dp={i:dd2.i,ans:mc+" Mafia are still alive."}}else G.dp={i:dd2.i,mode:d.dq=="mp"?"qp":"qr"}}
else if(d.dpr!==undefined){var dd3=G.dp,al=false;S.assign.forEach(function(q,i){if(G.alive[i]&&q.role==d.dpr)al=true});G.used[dd3.i]=true;G.dp={i:dd3.i,ans:R[d.dpr].n+(al?" is still alive.":" is not alive.")}}
else if(d.p!==undefined){var pi=+d.p,st=G.order&&G.order[G.oi],need=(S.step==5&&st&&st.need)||1;
if(pi<0)G.sel=[];else if(need==2){var q=G.sel.indexOf(pi);if(q>-1)G.sel.splice(q,1);else if(G.sel.length<2)G.sel.push(pi)}else G.sel=[pi]}
render()});

$.addEventListener("change",function(e){if(e.target.dataset&&e.target.dataset.ai!==undefined){S.assign[+e.target.dataset.ai].role=e.target.value;render();return}if(e.target.id=="lang"){S.lang=e.target.value;saveSet();lastSp="";render()}});
