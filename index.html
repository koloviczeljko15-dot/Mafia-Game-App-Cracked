<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Mafia Game</title>
<style>
:root{--bg:#0b1020;--card:#151c34;--line:#26305a;--tx:#e8ecff;--mut:#8f9ac4;--ac:#e0457b;--ok:#4fd1a5;--bl:#4c8dff;--warn:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3fb;--card:#fff;--line:#d5daf0;--tx:#161b33;--mut:#5b648c}}
:root[data-theme="light"]{--bg:#f1f3fb;--card:#fff;--line:#d5daf0;--tx:#161b33;--mut:#5b648c}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c34;--line:#26305a;--tx:#e8ecff;--mut:#8f9ac4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:15px;margin:0}
p{color:var(--mut);margin:4px 0 14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.tiny{flex:none!important;padding:5px 10px!important;font-size:13px!important;border-radius:9px!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:5px 6px;font:inherit;font-size:13px;max-width:150px}
.top .set{display:flex;gap:6px;align-items:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{padding:16px 0;font-size:22px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.num.sel{border-color:var(--ac);background:var(--ac);color:#fff}
.small{grid-template-columns:repeat(5,1fr)}.small .num{padding:10px 0;font-size:15px}
.name{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-bottom:8px}
.name span{color:var(--mut);min-width:20px}.name span.lb{min-width:52px}.name input{flex:1;background:none;border:0;padding:10px 0;min-width:0}
.name.dup{border-color:var(--warn)}
.role{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;opacity:.6}
.role.on{opacity:1;border-color:var(--bl)}
.role .dot{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:18px}
.role .t{flex:1;min-width:0}.role b{display:block}.role small{color:var(--mut);display:block;line-height:1.3}
.lock{color:var(--warn);font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar div{max-width:520px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;padding:14px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:bold}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--tx);flex:0 0 auto;padding:14px 16px}
.btn:disabled{opacity:.4}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.reveal{text-align:center;padding:40px 8px}
.rc{margin:20px auto;padding:30px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rc .big{font-size:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:9}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%}
.modal input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin:8px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:none}
.err{color:var(--warn);min-height:20px;margin:0}
.pl{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
.pl.dead{opacity:.45;text-decoration:line-through}
.pl button{border:1px solid var(--line);border-radius:8px;background:none;padding:6px 10px}
.chk{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{margin-right:10px}
.tile{padding:20px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}.tile.done{border-color:var(--ok)}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}.opt.sel{border-color:var(--ac);background:var(--ac);color:#fff}
.paper{background:#efe6cf;color:#2b2418;border-radius:12px;padding:16px;margin-bottom:12px}.paper h2{margin:0 0 4px}.paper p{color:#2b2418;margin:0}
.night{background:#05070f;color:#e8ecff;border-radius:16px;padding:8px 12px 1px;margin-bottom:12px}
.rbox{height:210px;overflow-y:auto;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.rbox h2{margin:10px 0 2px;font-size:15px}.rbox p{margin:0 0 8px;color:var(--tx)}
@media (prefers-reduced-motion:no-preference){.rc{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}}}
</style>
</head>
<body>
<main id="app"></main>

function goalOf(id){if(isMaf(id))return"Win when the Mafia team equals or outnumbers everyone else alive. Stay hidden and remove villagers.";if(id=="jester")return"Get yourself voted out during the day. You win alone if that happens.";if(id=="exec")return"Get the village to vote out your secret target. You win alone if that happens.";if(id=="survivor")return"Be alive when the game ends. You win whichever side wins.";return"Win with the village by voting out every Mafia member."}
function roleCard(id,intro,action){var r=R[id];return'<div class="reveal" style="padding:12px 0"><p>'+intro+'</p><div class="big">'+r.e+'</div><h1 style="color:'+r.c+'">'+r.n+'</h1><p style="margin:0 0 6px">Scroll to the bottom and read everything.</p><div id="rolebox" class="rbox"><h2>What you do</h2><p>'+r.d+'</p><h2>Your goal</h2><p>'+goalOf(id)+'</p><h2>Tips</h2><p>'+(TIPS[id]||"")+'</p><h2>Remember</h2><p>Keep your role secret. Do not show your screen to anyone. Do not say your role out loud unless it is part of your plan.</p><h2>Ready?</h2><p>When you have read it all, the button below unlocks. After you tap it, your role is hidden and you cannot check it again.</p></div><button id="memobtn" class="btn" data-a="'+action+'" style="width:100%;margin-top:10px"'+(S.read?"":" disabled")+'>I have memorized my role</button></div>'}

if(S.step==11||chg)render()}))}

function dealSeed(names,pick,seed){var l=[];for(var k in pick)for(var i=0;i<pick[k];i++)l.push(k);var r=prng(seed);for(var x=l.length-1;x>0;x--){var j=Math.floor(r()*(x+1)),t=l[x];l[x]=l[j];l[j]=t}return names.map(function(n,i){return{name:n,role:l[i]}})}
